executor: KubernetesExecutor

fernetKey: "z18LcO61ndDxxw6doJFpKbU/00xu9xd+rmH5Jo0u66A="
webserverSecretKey: "uMfJGfu+wyyfw0NRz1x1rOeldetb+oRKr9lJxuZB+XI="

# Use latest Airflow version (3.0.6 as of Oct 2025)
defaultAirflowTag: "3.0.6"

images:
  airflow:
    repository: poc/airflow-cosmos
    tag: "3.0.6"
    pullPolicy: IfNotPresent

airflow:
  config:
    core:
      base_log_folder: /opt/airflow/local_logs
      remote_logging: "False"
      dag_dir_list_interval: 10
    kubernetes:
      worker_pods_log_fetch_method: "pod"
      enable_task_log_server: "False"
      use_local_logs: true
      delete_worker_pods: false  # Changed to false for debugging
      worker_pods_creation_batch_size: 1
      worker_pods_pending_timeout: 300
      logs_volume_subpath: ""
    # task logs fetched via k8s API, not per-pod log server
    enable_task_log_server: "False"


# ───────────── DAG Synchronization (gitSync) ─────────────
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/OrestOhorodnyk/dbt_repo_aggregator.git"
    branch: "cosmos"
    subPath: "dags"
    rev: "HEAD"
    depth: 1
    wait: 10
    maxFailures: 0
    env:
      - name: GIT_SYNC_SUBMODULES
        value: "recursive"


    # If repo is private, mount a secret or SSH key
    # sshSecret: "git-ssh-key"
    # sshKnownHosts: |
    #   github.com ssh-rsa AAAAB3Nza...

# ───────────── Connections ─────────────
connections:
  - conn_id: postgres_dbt
    conn_type: postgres
    conn_host: postgres-service
    conn_login: dbt
    conn_password: dbt
    conn_schema: analytics
    conn_port: 5432

# ───────────── API Server (enabled for Airflow 3.0+) ─────────────
# API Server is available in Airflow 3.0+, no need to disable

# ───────────── LOG host mounts ─────────────
web:
  extraVolumes:
    - name: local-logs
      hostPath:
        path: /Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: local-logs
      mountPath: /opt/airflow/local_logs

scheduler:
  extraVolumes:
    - name: local-logs
      hostPath:
        path: /Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: local-logs
      mountPath: /opt/airflow/local_logs
  # using custom image; no runtime installs needed

dagProcessor:
  extraVolumes:
    - name: local-logs
      hostPath:
        path: /Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: local-logs
      mountPath: /opt/airflow/local_logs
  # using custom image; no runtime installs needed

triggerer:
  extraVolumes:
    - name: local-logs
      hostPath:
        path: /Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: local-logs
      mountPath: /opt/airflow/local_logs

workers:
  # Note: With KubernetesExecutor, Celery workers are not used (worker pods are ephemeral)
  # This section is kept for Helm chart compatibility
  replicas: 1
  serviceAccount:
    create: true

# ───────────── PostgreSQL ─────────────
postgresql:
  image:
    repository: bitnami/postgresql
    tag: "latest"
  persistence:
    enabled: true
    size: 5Gi
  volumePermissions:
    enabled: false

# ───────────── Disable PVC logs (using hostPath instead due to local-path ReadWriteOnce limitation) ─────────────
logs:
  persistence:
    enabled: false

kubernetesPodTemplate:
  enabled: false