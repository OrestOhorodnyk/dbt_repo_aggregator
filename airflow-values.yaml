scheduler:
  enabled: true
  replicas: 1
  extraVolumes:
    - name: dags-local
      hostPath:
        path: "/Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/dags"
        type: DirectoryOrCreate
    - name: local-logs
      hostPath:
        path: "/Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs"
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: dags-local
      mountPath: /opt/airflow/dags
      readOnly: true
    - name: local-logs
      mountPath: /opt/airflow/local_logs

  extraContainers:
    - name: dbt-git-sync
      image: poc/dbt-postgres:1.9.1-arm
      command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "Starting dbt repo sync + conditional compile..."
          GIT_CONFIG_FILE=/tmp/gitconfig
          git config --file "$GIT_CONFIG_FILE" --add safe.directory /opt/airflow/dags
          git config --file "$GIT_CONFIG_FILE" --add safe.directory /opt/airflow/dags/dbt_repo_1
          git config --file "$GIT_CONFIG_FILE" --add safe.directory /opt/airflow/dags/dbt_repo_2
          export GIT_CONFIG_SYSTEM=$GIT_CONFIG_FILE
          cd /opt/airflow/dags
          mkdir -p /opt/airflow/dags/manifests

          while true; do
            for repo in dbt_repo_1 dbt_repo_2; do
              if [ ! -d "$repo/.git" ]; then
                echo "📥 Cloning $repo..."
                git clone https://github.com/OrestOhorodnyk/$repo.git
                changed=true
              else
                echo "🔄 Checking $repo for updates..."
                cd $repo
                GIT_OUTPUT=$(git pull --ff-only)
                cd ..
                echo "$GIT_OUTPUT"
                if echo "$GIT_OUTPUT" | grep -q -e "Already up to date"; then
                  changed=false
                else
                  changed=true
                fi
              fi

            done

            echo "⏰ Next check in 1 minute..."
            sleep 60
          done

      volumeMounts:
        - name: dags-local
          mountPath: /opt/airflow/dags
      env:
        - name: DBT_HOST
          value: "postgres-service.airflow.svc.cluster.local"
        - name: DBT_USER
          value: "dbt"
        - name: DBT_PASS
          value: "dbt"
        - name: DBT_PORT
          value: "5432"
        - name: DBT_DBNAME
          value: "analytics"
        - name: DBT_SCHEMA
          value: "public"
      securityContext:
        runAsUser: 50000
        runAsGroup: 50000

  # using custom image; no runtime installs needed

