# Changed to LocalExecutor so KubernetesPodOperator (used by Cosmos) can create pods independently
# KubernetesExecutor intercepts all tasks and uses worker image template, preventing custom images
# LocalExecutor is simpler than CeleryExecutor and works for this use case
executor: LocalExecutor

fernetKey: "z18LcO61ndDxxw6doJFpKbU/00xu9xd+rmH5Jo0u66A="
webserverSecretKey: "uMfJGfu+wyyfw0NRz1x1rOeldetb+oRKr9lJxuZB+XI="

images:
  airflow:
    repository: poc/airflow-cosmos
    tag: "3.0.6"
    pullPolicy: IfNotPresent

airflow:
  migrateDatabase: true
  waitForMigrations:
    enabled: false
  config:
    core:
      base_log_folder: /opt/airflow/local_logs
      remote_logging: "False"
      dag_dir_list_interval: 10
    kubernetes:
      # Use 'ip' method to fetch logs by IP instead of hostname
      # Note: For pods that don't expose log server, logs should be written to shared volume
      worker_pods_log_fetch_method: "ip"
      use_local_logs: true
      # Temporarily set to false to keep pods for debugging
      # Change back to true after fixing the entrypoint issue
      delete_worker_pods: false
      worker_pods_creation_batch_size: 1
      worker_pods_pending_timeout: 300
      logs_volume_subpath: ""
      # Disable log serving for Kubernetes pods (since dbt pods don't expose log server)
      # Logs will be read from shared volume instead
      worker_pods_queued_timeout: 300
      # Ensure logs are fetched from volume, not HTTP endpoint
      worker_pods_readiness_timeout: 60

connections:
  - conn_id: postgres_dbt
    conn_type: postgres
    conn_host: postgres-service
    conn_login: dbt
    conn_password: dbt
    conn_schema: analytics
    conn_port: 5432

  - conn_id: kubernetes_default
    conn_type: kubernetes
    conn_extra: '{"in_cluster": true, "namespace": "airflow"}'

  - conn_id: google_cloud_default
    conn_type: google_cloud_platform
    # Keyfile path - file is mounted at /opt/airflow/dags/utils/gcp-key.json
    # The GCSHook will use this connection automatically
    conn_extra: '{"key_path": "/opt/airflow/dags/utils/gcp-key.json"}'

# ───────────── DAG + LOG host mounts ─────────────
web:
  extraVolumes:
    - name: dags-local
      hostPath:
        path: "/Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/dags"
        type: DirectoryOrCreate
    - name: local-logs
      hostPath:
        path: "/Users/o.ohorodnyk/Documents/repositoties/dbt_repo_aggregator/airflow_logs"
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: dags-local
      mountPath: /opt/airflow/dags
      readOnly: true
    - name: local-logs
