# ───────────── PostgreSQL ─────────────
postgresql:
  image:
    repository: bitnami/postgresql
    tag: "latest"
  persistence:
    enabled: true
    size: 5Gi
  volumePermissions:
    enabled: false

# ───────────── Disable internal PVC for logs ─────────────
logs:
  persistence:
    enabled: false
