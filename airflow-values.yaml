executor: KubernetesExecutor

fernetKey: "z18LcO61ndDxxw6doJFpKbU/00xu9xd+rmH5Jo0u66A="
webserverSecretKey: "uMfJGfu+wyyfw0NRz1x1rOeldetb+oRKr9lJxuZB+XI="

airflow:
  requirements:
    enabled: true
    path: /opt/airflow/dags/requirements.txt

  config:
    core:
      base_log_folder: /opt/airflow/local_logs
      remote_logging: "False"
      dag_dir_list_interval: 10
    kubernetes:
      worker_pods_log_fetch_method: "ip"
      use_local_logs: true
      delete_worker_pods: true
      worker_pods_creation_batch_size: 1
      worker_pods_pending_timeout: 300
      logs_volume_subpath: ""


# ───────────── DAG Synchronization (gitSync) ─────────────
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/OrestOhorodnyk/dbt_repo_aggregator.git"
    branch: "dev"
    subPath: "dags"
    rev: "HEAD"
    depth: 1
    wait: 10
    maxFailures: 0


    # If repo is private, mount a secret or SSH key
    # sshSecret: "git-ssh-key"
    # sshKnownHosts: |
    #   github.com ssh-rsa AAAAB3Nza...

# ───────────── Connections ─────────────
connections:
  - conn_id: postgres_dbt
    conn_type: postgres
    conn_host: postgres-service
    conn_login: dbt
    conn_password: dbt
    conn_schema: analytics
    conn_port: 5432

  - conn_id: kubernetes_default
    conn_type: kubernetes
    conn_extra: '{"in_cluster": true, "namespace": "airflow"}'

# ───────────── LOG host mounts ─────────────
web:
  extraVolumes:
    - name: local-logs
      hostPath:
        path: /Users/o.ohorodnyk/airflow-dags/airflow_logs
        type: DirectoryOrCreate
  extraVolumeMounts:
    - name: local-logs
      mountPath: /opt/airflow/local_logs

